<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>📝 Simple To-Do List</h1>

    <form id="task-form" class="card">
      <input type="hidden" id="task-id">
      <input type="text" id="title" placeholder="Task name" required>
      <div class="row">
        <select id="priority">
          <option value="High">High</option>
          <option value="Medium" selected>Medium</option>
          <option value="Low">Low</option>
        </select>
        <input type="date" id="due-date">
      </div>
      <div class="row">
        <button type="submit" id="submit-btn">Add Task</button>
        <button type="button" id="cancel-btn" class="secondary" hidden>Cancel</button>
      </div>
    </form>

    <div class="filters">
      <button class="filter active" data-filter="all">All</button>
      <button class="filter" data-filter="pending">Pending</button>
      <button class="filter" data-filter="completed">Completed</button>
    </div>

    <ul id="task-list"></ul>
    <p id="empty" class="empty" hidden>No tasks found.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
