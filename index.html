<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>📝 Simple To-Do List</h1>

    <details class="card settings">
      <summary>📱 Phone alert settings</summary>
      <p class="hint">
        1) Install the free <b>ntfy</b> app on your phone.<br>
        2) Subscribe to the same topic name written below.<br>
        3) Press "Send test alert".
      </p>
      <div class="row">
        <input type="text" id="topic" placeholder="ntfy topic name">
        <button type="button" id="save-topic">Save</button>
      </div>
      <button type="button" id="test-alert" class="secondary">Send test alert to phone</button>
    </details>

    <form id="task-form" class="card">
      <input type="hidden" id="task-id">
      <input type="text" id="title" placeholder="Task name" required>
      <select id="priority">
        <option value="High">High</option>
        <option value="Medium" selected>Medium</option>
        <option value="Low">Low</option>
      </select>
      <div class="row">
        <label class="field">Due date (empty = today)
          <input type="date" id="due-date">
        </label>
        <label class="field">Task time
          <input type="time" id="due-time">
        </label>
      </div>
      <label class="field">Remind me before (minutes)
        <input type="number" id="remind-before" min="1" step="any" value="30">
      </label>
      <div class="row">
        <button type="submit" id="submit-btn">Add Task</button>
        <button type="button" id="cancel-btn" class="secondary" hidden>Cancel</button>
      </div>
    </form>

    <div class="filters">
      <button class="filter active" data-filter="all">All</button>
      <button class="filter" data-filter="pending">Pending</button>
      <button class="filter" data-filter="completed">Completed</button>
    </div>

    <ul id="task-list"></ul>
    <p id="empty" class="empty" hidden>No tasks found.</p>
  </main>

  <div id="toast" class="toast" hidden></div>

  <div id="alarm" class="alarm" hidden>
    <div class="alarm-box">
      <h2>⏰ Time is up!</h2>
      <p id="alarm-text"></p>
      <button id="stop-alarm" type="button">Stop alarm</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
